name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.89.0"
  WASM_TARGET: wasm32-wasip1
  BUN_VERSION: "1.4.3"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # plain rustup, no third party action. rustup checks the release signatures.
      - name: rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$WASM_TARGET"
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            frost-dkg/target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'frost-dkg/Cargo.lock', 'frost-dkg/vendor/serai/**') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-

      - name: build the wasm crates
        run: |
          (cd rust && cargo build --locked --target "$WASM_TARGET" --release --lib)
          (cd frost-dkg && cargo build --locked --target "$WASM_TARGET" --release --lib)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        working-directory: typescript
        run: bun install --frozen-lockfile

      # tsc, then the inlined wasm and worker bundles. copywasm reads the rust targets above.
      - name: build
        working-directory: typescript
        run: bun run build

      # the fast unit tests only. acceptance and integration tests start monerod and stay local.
      - name: unit tests
        working-directory: typescript
        run: |
          bun test \
            ./tests/connection-status/unit \
            ./tests/scanCacheOpened/unit \
            ./tests/scanLoop/unit \
            ./tests/send-functionality/unit \
            ./tests/tools/unit \
            ./tests/unpacked/unit
